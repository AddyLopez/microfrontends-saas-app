name: deploy-marketing

# Watches for push event in any file in marketing directory on master branch
on:
  push:
    branches:
      - main
    paths:
      - "packages/marketing/**"

# Sets execution environment to marketing directory for running commands
defaults:
  run:
    working-directory: packages/marketing

# Builds then deploys the app. Runs on Linex-based virtual machine.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2 # Takes code from repository and checks it out, i.e. loads it, onto virtual machine
      - run: npm install # Installs all dependencies into project
      - run: npm run build # Runs webpack build process and generates dist directory

      - uses: shinyinc/action-aws-cli@v1.2 # Gives programatic access to AWS CLI in order to deploy built files to Amazon S3
      - run: aws s3 sync dist s3://${{ secrets.AWS_S3_BUCKET_NAME }}/marketing/latest # Uses CLI to run this command. Syncs contents of dist directory with S3 bucket (place to store files on AWS)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAUT_REGION: us-east-2
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} --paths "/marketing/latest/remoteEntry.js" # create automated invalidation to ensure latest version of remoteEntry.js is served by AWS CloudNet
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAUT_REGION: us-east-2
